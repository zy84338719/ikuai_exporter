# ikuai_exporter 部署示例（v4-only，个人令牌认证）。
# 每台路由器对应一个服务实例，监听不同端口，用 -router-label 区分。
# v3 用户名/密码模式已不再支持。

services:

  # ── 第一台路由器 ──────────────────────────────────────────────────────────
  ikuai-exporter-office:
    image: ghcr.io/zy84338719/ikuai_exporter:latest
    container_name: ikuai-exporter-office
    restart: unless-stopped
    # 收到 SIGTERM 后 exporter 会排空在途 scrape 再退出，给它足够的窗口，
    # 需 >= -shutdown-timeout（默认 15s）加 scrape 余量。
    stop_grace_period: 30s
    ports:
      - "9100:9100"
    command:
      - -router=http://10.10.30.254        # 路由器地址（自动转 HTTPS）
      - -token=YOUR_API_TOKEN              # 个人令牌：系统设置 → 个人令牌
      - -router-label=office               # 指标的 router 标签值
      - -listen=:9100

  # ── 第二台路由器（复制并改地址/端口/标签）────────────────────────────────
